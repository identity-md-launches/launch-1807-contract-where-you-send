[profile.default]
src = "src"
test = "test"
out = "out"
libs = ["lib"]
solc = "0.8.26"
evm_version = "cancun"
optimizer = true
optimizer_runs = 200
bytecode_hash = "none"
remappings = ["forge-std/=lib/forge-std/src/"]

[profile.default.fuzz]
runs = 1024

[profile.default.invariant]
runs = 128
depth = 32
fail_on_revert = true

[fmt]
line_length = 120
